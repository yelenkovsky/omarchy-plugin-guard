[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-plugin-guard"
version = "0.1.0"
description = "Review Omarchy shell plugin updates before they merge into ~/.config/omarchy/plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xbloc" }]
dependencies = ["cursor-sdk"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
omarchy-plugin-guard = "omarchy_plugin_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
