[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-plugin-guard"
version = "0.2.0"
description = "Review Omarchy shell plugin updates before they merge into ~/.config/omarchy/plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "xbloc" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
omarchy-plugin-guard = "omarchy_plugin_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Only sets where import sorting wraps; E501 is off because the repo has no formatter.
line-length = 100

[tool.ruff.lint]
# Explicit families, so a ruff upgrade cannot change what CI checks.
# Target version comes from requires-python.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "C4", "RUF", "PLE", "PLW"]
# try/except/pass is the house style for best-effort cleanup, not contextlib.suppress.
ignore = ["SIM105"]
# The agent-review progress message uses an en dash for its time range.
allowed-confusables = ["–"]
